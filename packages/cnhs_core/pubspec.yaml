name: cnhs_core
description: Shared UI kit, API client, realtime and notification services for the CNHS apps.
publish_to: none
version: 1.0.0
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.0.10
  local_notifier: ^0.1.6
  file_picker: ^8.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
flutter:
  assets:
    - assets/logo.png
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
          weight: 400
        - asset: assets/fonts/Fraunces.ttf
          weight: 600
        - asset: assets/fonts/Fraunces.ttf
          weight: 700
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 700
