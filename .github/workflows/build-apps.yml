name: Build apps

# Builds all three apps on GitHub's servers. Push a tag like v1.0.0 to also publish them on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.4"          # change here to upgrade Flutter for every job
  API_BASE: ${{ vars.API_BASE }}      # Repository variable: your Render URL, e.g. https://cnhs-portal.onrender.com

jobs:
  android:
    name: Android - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: student, label: "CNHS Student" }
          - { app: teacher, label: "CNHS Teacher" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Prepare Android project
        run: tools/prepare_app.sh "${{ matrix.app }}" android "${{ matrix.label }}"
      - name: Build APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --release --dart-define=API_BASE="${API_BASE:-https://cnhs-portal.onrender.com}"
      - name: Name the file
        run: cp apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk cnhs-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: "cnhs-${{ matrix.app }}-android", path: "cnhs-${{ matrix.app }}.apk" }

  windows:
    name: Windows - ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: admin, label: "CNHS Staff" }
          - { app: teacher, label: "CNHS Teacher" }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Prepare Windows project
        shell: bash
        run: tools/prepare_app.sh "${{ matrix.app }}" windows "${{ matrix.label }}"
      - name: Build Windows app
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: flutter build windows --release --dart-define=API_BASE="${API_BASE:-https://cnhs-portal.onrender.com}"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path apps/${{ matrix.app }}/build/windows/x64/runner/Release/* -DestinationPath cnhs-${{ matrix.app }}-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: "cnhs-${{ matrix.app }}-windows", path: "cnhs-${{ matrix.app }}-windows.zip" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }
