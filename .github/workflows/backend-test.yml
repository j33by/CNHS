name: Backend tests
on:
  push: { paths: ["backend/**"] }
  pull_request: { paths: ["backend/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: cnhs }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:pw@localhost:5432/cnhs
      DB_SSL: "false"
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      SITE_URL: http://localhost:3000
      ADMIN_USER: admin
      ADMIN_NAME: CI Admin
      ADMIN_PASS: "Str0ng!Passw0rd#"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run migrate && npm run create-admin
      - run: |
          node src/server.js &
          sleep 4
          BASE=http://localhost:3000 node --test test/smoke.test.js test/sweep.test.js
